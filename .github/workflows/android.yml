name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      # --- Build ---

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      # --- Unit Tests ---

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      # --- Coverage Report ---

      - name: Enforce JaCoCo coverage thresholds
        run: ./gradlew jacocoCoverageVerification

      - name: Generate JaCoCo coverage report
        run: ./gradlew jacocoUnitTestReport

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build/reports/jacoco/jacocoUnitTestReport/html/
          retention-days: 7

      # --- Upload APK ---

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: watomatic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
